events {
    worker_connections 1024;
}

http {
    # Define the pool of servers to load balance across
    upstream nest_api {
        server api-1:3000;
        server api-2:3000;
        server api-3:3000;
    }

    server {
        listen 80;

        location / {
            # Route traffic to the upstream pool
            proxy_pass http://nest_api;

            # CRITICAL: Headers required to allow Socket.io WebSockets through Nginx
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward the original client IP and Host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
