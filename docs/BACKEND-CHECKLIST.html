const STORAGE_KEY = "music-room-checklist-v2";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    /* storage unavailable, fail silently */
  }
}

let state = loadState();

function itemKey(phaseIdx, itemIdx) {
  return phaseIdx + "-" + itemIdx;
}

function render() {
  // Capture currently open phase indices before re-rendering
  const openPhases = new Set();
  document.querySelectorAll(".phase.open").forEach(sec => {
    openPhases.add(sec.dataset.phaseIdx);
  });

  const container = document.getElementById("phases");
  container.innerHTML = "";
  let totalItems = 0;
  let totalChecked = 0;

  DATA.forEach((phase, pIdx) => {
    const checkedCount = phase.items.filter((_, iIdx) => state[itemKey(pIdx, iIdx)]).length;
    totalItems += phase.items.length;
    totalChecked += checkedCount;
    const complete = checkedCount === phase.items.length;

    const section = document.createElement("section");
    section.className = "phase";
    section.dataset.phaseIdx = pIdx;

    // Preserve open state if it was open
    if (openPhases.has(String(pIdx))) {
      section.classList.add("open");
    }

    const head = document.createElement("div");
    head.className = "phase-head" + (complete ? " complete" : "");
    head.innerHTML = `
      <div class="phase-num">${complete ? "✓" : phase.num}</div>
      <div class="phase-titles">
        <span class="tag">${phase.tag}</span><span class="difficulty diff-${phase.difficulty}">${phase.difficulty}</span><span class="hours-badge">~${phase.hours}</span>
        <h2>${phase.title}</h2>
      </div>
      <div class="phase-count">${checkedCount}/${phase.items.length}</div>
      <div class="chev">▸</div>
    `;
    head.addEventListener("click", () => {
      section.classList.toggle("open");
    });

    const body = document.createElement("div");
    body.className = "phase-body";

    const intro = document.createElement("p");
    intro.className = "phase-intro";
    intro.textContent = phase.intro;
    body.appendChild(intro);

    phase.items.forEach((item, iIdx) => {
      const key = itemKey(pIdx, iIdx);
      const checked = !!state[key];
      const row = document.createElement("div");
      row.className = "item" + (checked ? " checked" : "");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.id = "cb-" + key;
      cb.checked = checked;
      cb.addEventListener("change", () => {
        state[key] = cb.checked;
        saveState(state);
        render();
      });

      const label = document.createElement("label");
      label.setAttribute("for", "cb-" + key);
      label.innerHTML = `<span class="item-title">${item[0]}</span><span class="item-desc">${item[1]}</span>`;

      row.appendChild(cb);
      row.appendChild(label);
      body.appendChild(row);
    });

    section.appendChild(head);
    section.appendChild(body);
    container.appendChild(section);
  });

  document.getElementById("progress-count").textContent = totalChecked + " / " + totalItems;
  const pct = totalItems ? Math.round((totalChecked / totalItems) * 100) : 0;
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("bar-fill").style.width = pct + "%";
}

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Clear all checkmarks?")) {
    state = {};
    saveState(state);
    render();
  }
});

render();

// Open the first phase with an unchecked item by default on initial load
(function openFirstIncomplete() {
  const sections = document.querySelectorAll(".phase");
  for (let i = 0; i < DATA.length; i++) {
    const checkedCount = DATA[i].items.filter((_, iIdx) => state[itemKey(i, iIdx)]).length;
    if (checkedCount < DATA[i].items.length) {
      sections[i].classList.add("open");
      break;
    }
  }
})();
</script>
</body>
</html>
